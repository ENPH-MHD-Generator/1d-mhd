[project]
name = "1d-mhd"
version = "0.1.0"
description = "A simple, one-dimensional simulation of a linear hall MHD generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "scipy-stubs~=1.16.3",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
ui = [
    "plotly>=7.0.0",
    "streamlit>=1.62.0",
    "tomli-w>=1.2.0",
]

[tool.uv]
package = false
python-preference = "only-managed"
python-downloads = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


