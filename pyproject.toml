[project]
name = "1d-mhd"
version = "0.1.0"
description = "A simple, one-dimensional simulation of a linear hall MHD generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "scipy-stubs~=1.16.3",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
ui = [
    "plotly>=7.0.0",
    "streamlit>=1.62.0",
    "tomli-w>=1.2.0",
]

[tool.uv]
package = false
python-preference = "only-managed"
python-downloads = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

# This project isn't installed as a package (`package = false` above), so
# `import magnetohydrodynamics` (in every test file, via tests/conftest.py) only
# resolves if the repo root is on sys.path. `pythonpath` makes pytest add it
# explicitly and unconditionally, rather than relying on whatever incidental
# sys.path insertion the invoking tool/CWD happens to produce -- that incidental
# behavior is what CI's `uv run pytest` hit as
# `ModuleNotFoundError: No module named 'magnetohydrodynamics'` (not reproducible in
# an ad-hoc local `uv run pytest`, which is exactly the kind of environment-dependent
# fragility an explicit `pythonpath` avoids for good).
[tool.pytest.ini_options]
pythonpath = ["."]

# `uv run pytest --cov --cov-report=term-missing` for a per-file coverage table (this
# config just scopes it to the library and skips test files themselves so `--cov` alone
# is enough, without needing `--cov=magnetohydrodynamics` spelled out each time).
[tool.coverage.run]
source = ["magnetohydrodynamics"]
omit = ["tests/*"]

# `uv run mypy magnetohydrodynamics tests examples main.py ui/stability_tab.py` --
# deliberately NOT ui/app.py itself yet: it has a handful of real (if minor)
# scipy/numpy typing mismatches, but that file is due for a rework, so fixing its
# types now would likely be thrown away; revisit typing it once that rework lands.
# ui/stability_tab.py is newer code living in the same directory and is clean, so it
# IS included above -- don't assume everything under ui/ is excluded.
[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# None of these ship type stubs/a py.typed marker; nothing to check against beyond "did
# this import resolve at all." (sympy: only used in tests/test_tapered_derivation_sympy.py,
# to symbolically verify Derivation.md's variable-area momentum/energy ODEs.)
[[tool.mypy.overrides]]
module = ["mpl_toolkits.*", "plotly.*", "sympy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 160  # matches this codebase's existing long-line style (see e.g. hall_solver.py)
target-version = "py313"
extend-exclude = ["tests/reference_main.py"]  # frozen, hand-validated oracle -- not this repo's own style

[tool.ruff.lint]
# Deliberately NOT the flake8-comprehensions family (C4) -- it flags dict(key=value),
# which this codebase uses as a deliberate house style throughout (e.g. every
# HallSolver result dict), not a mistake to "fix".
select = [
    "E", "F",   # pycodestyle errors + pyflakes: real bugs (unused imports/vars, undefined names, ...)
    "I",        # isort: import ordering
    "UP",       # pyupgrade: modern-Python idioms (this repo targets 3.13 only)
    "B",        # flake8-bugbear: common correctness pitfalls
    "SIM",      # flake8-simplify
    "RUF",      # ruff's own additional checks
]

[tool.ruff.lint.isort]
known-first-party = ["magnetohydrodynamics"]

